name: Lab04 - testes

on:
  push:
    paths:
      - "Laboratorio4/**"
      - ".github/workflows/lab04-tests.yml"
  pull_request:
    paths:
      - "Laboratorio4/**"
      - ".github/workflows/lab04-tests.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Laboratorio4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Laboratorio4/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
